[mypy]
python_version = 3.12
strict = False

files = .

plugins = mypy_django_plugin.main

explicit_package_bases = True

exclude =
    .*/migrations/.*
    .*/tests/.*
    venv/

[mypy.plugins.django-stubs]
django_settings_module = config.settings

[mypy-django_filters.*]
ignore_missing_imports = True

[mypy-djoser.*]
ignore_missing_imports = True

[mypy-rest_framework.*]
ignore_missing_imports = True

[mypy-debug_toolbar.*]
ignore_missing_imports = True
