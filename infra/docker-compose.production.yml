volumes:
  pg_data:
  static_value:
  media_value:

services:

  db:
    container_name: foodgram-db
    image: postgres:15
    env_file: ../.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      start_period: 10s
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: kolesnikyi/foodgram_backend:latest
    env_file: ../.env
    volumes:
      - static_value:/backend_static
      - media_value:/app/backend/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: kolesnikyi/foodgram_frontend:latest
    volumes:
      - ../frontend/:/app/result_build/

  nginx:
    container_name: foodgram-proxy
    image: nginx:1.25.4-alpine
    env_file: ../.env
    ports:
      - "9000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_value:/static
      - media_value:/media
    depends_on:
      - backend
      - frontend
