name: Main Foodgram workflow

on: push

jobs:
  backend_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./backend/requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: |
          cd backend/
          python -m mypy .

  build_and_push_backend:
    name: Push backend image to DockerHub
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: backend_lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_and_push_frontend:
    name: Push frontend image to DockerHub
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: backend_lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
      - build_and_push_frontend
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose, nginx config and docs via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "infra/docker-compose.production.yml,infra/nginx.conf,docs"
          target: "foodgram"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd foodgram
            docker compose -f infra/docker-compose.production.yml pull
            docker compose -f infra/docker-compose.production.yml down
            docker compose -f infra/docker-compose.production.yml up -d
            docker image prune -f

  send_succes_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой проекта из репозитория ${{ github.repository }} успешно выполнен!
            Push сделал ${{ github.actor }}: ${{ github.event.commits[0].message }}.
            Ссылка на коммит: https://github.com/${{ github.repository }}/commit/${{github.sha}}.

  send_failure_message:
    runs-on: ubuntu-latest
    needs:
      - backend_lint
      - build_and_push_backend
      - build_and_push_frontend
      - deploy
    if: failure()
    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой проекта из репозитория ${{ github.repository }} завершился с ошибкой!
            Push сделал ${{ github.actor }}: ${{ github.event.commits[0].message }}.
            Статус джобов:
            lint: ${{ needs.backend_lint.result }}
            backend: ${{ needs.build_and_push_backend.result }}
            frontend: ${{ needs.build_and_push_frontend.result }}
            deploy: ${{ needs.deploy.result }}
            Подробности и лог ошибки: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
